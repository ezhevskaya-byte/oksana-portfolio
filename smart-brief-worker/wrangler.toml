name = "smart-brief-api"
main = "src/index.js"
compatibility_date = "2026-03-01"

# Secrets (set via wrangler, never commit values):
#   wrangler secret put OPENAI_API_KEY --name smart-brief-api
#   wrangler secret put YANDEX_API_KEY --name smart-brief-api
#   wrangler secret put YANDEX_API_KEY --name smart-brief-api-test
#
# Deploy (do NOT use bare `wrangler deploy` for provider switches):
#   npm run deploy:test     → smart-brief-api-test  (Yandex)
#   npm run deploy:prod     → smart-brief-api       (Yandex) — only with explicit approval
# Rollback provider (fast):
#   npm run deploy:prod:openai  → AI_PROVIDER=openai, same codebase
# Or pin previous Version ID:
#   npx wrangler rollback --name smart-brief-api --version-id <PREVIOUS_VERSION_ID>

# Top-level vars: conservative defaults for accidental bare `wrangler deploy`.
# Production/test provider is owned by [env.*] so a bare deploy cannot silently
# flip a migrated Yandex Worker back to openai via missing --var flags.
[vars]
OPENAI_MODEL = "gpt-5.4-mini"

# Production Worker — name MUST be explicit: wrangler otherwise deploys
# to "{name}-{env}" (e.g. smart-brief-api-production).
[env.production]
name = "smart-brief-api"
vars = { AI_PROVIDER = "yandex", OPENAI_MODEL = "gpt-5.4-mini", YANDEX_FOLDER_ID = "b1gkei7lv9uhdqqdtpgc", YANDEX_MODEL = "yandexgpt-5.1/latest", YANDEX_STRUCTURED_OUTPUT = "prompt_json" }

# Explicit OpenAI rollback env (same Worker name). Keeps OpenAI code path + OPENAI_API_KEY.
[env.production_openai]
name = "smart-brief-api"
vars = { AI_PROVIDER = "openai", OPENAI_MODEL = "gpt-5.4-mini" }

# Isolated test Worker — stable Yandex without fragile CLI --var lists.
[env.test]
name = "smart-brief-api-test"
vars = { AI_PROVIDER = "yandex", OPENAI_MODEL = "gpt-5.4-mini", YANDEX_FOLDER_ID = "b1gkei7lv9uhdqqdtpgc", YANDEX_MODEL = "yandexgpt-5.1/latest", YANDEX_STRUCTURED_OUTPUT = "prompt_json" }
